# ============================================================================
# config.yaml — 物理 / アクション / 符号 / センサ / デプロイ のユーザー調整ノブ(単一ソース)
#
#   ここを編集すればコードを触らずに挙動を変えられる。genesis_rl/user_config.py が読み込み、
#   contracts.py / config.py / dcl/client.py / sensors/imu.py の各定数を初期化する。
#   キーを消す/ファイルを消すと、各モジュールのコード内既定値(=下と同値)にフォールバック。
#
#   ※学習ハイパラ(sac / curriculum / run / hw と env のエピソード設定)は configs/train.yaml。
#   ※値を変えると contract_hash が変わり学習済みckptと非互換になる項目がある(action/observation)。
# ============================================================================

# --- アクションマッピング(方策 a∈[-1,1]^4 → 物理指令)。contracts.py ---
action:
  # 方策の行動レンジ(ユーザー指定 2026-07-28): レート ±1 rad/s、推力 0〜0.35。
  # 参考(実シムの物理上限、VQ1真値の振幅掃引 2026-07-27): 指令レートは約2.6rad/sで
  # クリップされ、5rad/sを送っても達成は roll 2.50 / yaw 2.36 rad/s で頭打ち。
  # ±1 はその内側なので飽和には当たらない(dynamics.rate_max=2.65 のクランプも効かない)。
  rate_limits:    [1.0, 1.0, 1.0]   # roll/pitch/yaw の指令レート上限 [rad/s](a=±1で±これ)
  # thrust ∈ [0, 0.35] = center ± halfspan。**a3=0 はホバーではない**点に注意:
  # A==g は thrust=0.2665(VQ1実測)なので、ホバーに対応する行動は a3=+0.523。
  # 推力0(自由落下)〜0.35(A=1.55g)まで使える広い帯で、上下の権限は旧設定(±0.0306)より大きい。
  thrust_center:  0.175             # a3=0 の推力(=レンジ中央。ホバーではない)
  thrust_halfspan: 0.175            # → thrust ∈ [0.0, 0.35]
  hover_thrust:   0.2665            # A==g 実測値(フェイルセーフ/逆写像/burn-inバイアス用)
  takeoff_thrust: 0.265             # 離陸/ピン解除の閾値(スタート出力。deploy START_THRUST)

# --- 観測スケール & ゲート検出。contracts.py ---
observation:
  rate_scale:        3.0            # gyro 正規化 [rad/s](達成レート上限 2.5 に整合)
  accel_scale:       25.0           # accel 正規化 [m/s^2]
  v_scale:           15.0           # 特権 velocity [m/s]
  pos_scale:         60.0           # 特権 position [m]
  gate_rel_scale:    30.0           # 特権 ゲート相対位置 [m]
  gate_area_max:     150000.0       # 学習側 rel_dist = 1 - bbox_area/これ(Genesis投影)
  gate_obs_max_age_s: 0.5           # これより古い検出は未検出扱い
  detect_latency_s:  0.0173         # 物体検出遅延(17.3ms)

# --- カメラ(実飛行でfit済みのintrinsics/取り付け)。contracts.py ---
camera:
  img_w: 640
  img_h: 360
  fx: 320.0
  fy: 320.0
  cx: 320.0
  cy: 180.0
  tilt_deg: 20.0                    # ボディから上向き

# --- タイミング(本番シム仕様)。contracts.py ---
timing:
  phys_hz: 120
  decimation: 4                     # 1決定=4物理ステップ → 30Hz

# --- 動力学 ---
# 2026-07-27: VQ1レガシー(テレメトリ有効)シムの *真値* テレメトリで再同定した。
# 3run/有効308秒/|v| 0〜11.8m/s/thrust 0.135〜0.38 を1つのベクトル最小二乗にかけた結果
# (scripts/analyze_truth.py。検証: 真値運動学から求めた比力と HIGHRES_IMU accel が
#  x/y 差rms 0.01・z 0.17 m/s² で一致 = 座標系と時刻整合が正しいことの証明)。
# 旧値はIMU単独同定(2026-07-23)で、速度を加速度の積分で作っていたため
# ドラッグを線形と誤認し(0.64)、推力の指数も過大(1.84)だった。
dynamics:
  mass:         0.9
  inertia:      [0.0065, 0.0065, 0.011]
  # 軸別レート追従P [1/s]。roll/pitch は τ≈16ms、yaw だけ τ≈29ms と遅い(実測)
  k_rate:       [61.0, 64.0, 35.0]
  # |達成レート/指令| の定常値(過渡0.15s除外の実測)。符号は signs.cmd 側で持つ
  cmd_gain:     [0.95, 0.96, 0.86]
  hover_thrust: 0.2665              # A = g*(t/0.2665)^1.66(多項式より残差が同等以下)
  thrust_alpha: 1.66
  # ドラッグはほぼ *純2次*: 線形項のみだと残差0.564、2次のみで0.435 m/s²。
  # (旧線形0.64は「4.5m/sで実効0.18、10.7m/sで0.44」を1本の線形で無理に説明していた)
  # body軸別(水平 xy / 鉛直 z)。等方だと残差0.435、軸別で0.385 m/s²
  drag_c:       0.0                 # 水平・線形 [1/s]
  drag_c2:      0.0427              # 水平・2次 [1/m] → a = -(c + c2|v|)·v_body
  drag_cz:      0.043               # 鉛直・線形 [1/s]
  drag_c2z:     0.0186              # 鉛直・2次 [1/m](水平の半分以下)
  # *指令* のクランプ [rad/s]。実シムの飽和(約2.6rad/s)を再現する。この後に cmd_gain が掛かる
  rate_max:     2.65

# --- ドメインランダム化(エピソード毎の倍率レンジ)。config.py DroneConfig ---
domain_rand:
  mass:         [0.9, 1.1]
  k_rate:       [0.8, 1.2]          # 実測でレート追従は較正値と数%以内で一致 → 旧[0.6,1.6]から縮小
  cmd_gain:     [0.95, 1.05]
  drag:         [0.85, 1.15]
  hover:        [0.98, 1.02]
  thrust_alpha: [0.95, 1.05]
  inertia:      [0.7, 1.3]

# --- 指令/観測の符号。config.py EnvConfig ---
# 2026-07-27 VQ1真値で確定。基準は「ODOMETRYクォータニオンをy軸鏡像で直した標準FRD」
# (DCLは姿勢を左手系で配信している。analyze_truth.ODOM_QUAT_YMIRROR 参照)。
#   指令 → 標準FRD角速度   = (-0.86, -0.88, -0.77) → 符号は全軸 -1
#   標準FRD角速度 → 生gyro = (-0.90, -0.99, -0.89) → 符号は全軸 -1
#   accel は標準FRD比力そのまま(差rms 0.01 m/s²)
# 旧値は yaw の指令符号と roll/pitch の観測符号が逆で、学習↔実機で yaw の回る向きが
# 反転していた(見た目の対応が壊れる=方策が逆に舵を切る)。
signs:
  cmd:   [-1.0, -1.0, -1.0]         # 指令→内部FRDレート目標の符号
  gyro:  [-1.0, -1.0, -1.0]         # 内部FRD角速度→観測gyro(=生HIGHRES_IMU)の符号
  accel: [1.0, 1.0, 1.0]

# --- センサ(IMU/検出ノイズ・遅延)。config.py SensorConfig + sensors/imu.py ---
sensor:
  # 実機HIGHRES_IMUは飛行中 ~100Hz(VQ1実測 2026-07-27。旧「~56Hz」は受信取りこぼし
  # を含む古い計測だった) → 120Hz物理の等倍が最も近い
  imu_decimation:    1              # 120Hz/1=120Hz(実機~100Hzに整合)
  accel_sigma:       0.4
  accel_bias_init:   0.2
  accel_bias_walk:   0.01
  accel_spike_p:     0.001
  gyro_sigma:        0.008
  gyro_bias_init:    0.02
  gyro_bias_walk:    0.001
  det_px_base:       2.0
  det_px_gain:       40.0
  det_dropout_base:  0.02
  det_dropout_close: 0.10
  det_outlier_p:     0.01
  # YOLOX-x の実bbox面積は幾何投影 (FX·2.7/d)² の1.10倍(既知距離レンダで実測 2026-07-26)。
  # 学習側でこの倍率を掛けておくと deploy は契約値 gate_area_max=150000 のままで rel_dist が
  # 一致する(旧: deploy側で25000へ下げる誤較正 → 同距離でrel_distが6倍小さかった)。
  det_bbox_gain:     1.10
  # deploy の GateYOLOX min_area[px²]。これ未満のbboxは捨てられる(=遠方ゲートが不可視に)。
  # 500px² は約39m相当。学習側も距離ではなく見かけ面積で可視判定して規約を揃える。
  det_min_area:      500.0
  # 遅延[決定フレーム @30Hz]。実機の実測は映像85ms・検出も同一フレーム由来なので同じ段数。
  # 1段(33ms)だと age_n が学習0.07 vs 実機0.17 でズレる(2026-07-26 実測)。2+jitter1 → 67-100ms。
  det_delay_frames:  2
  det_delay_jitter:  1
  img_delay_frames:  2
  img_delay_jitter:  1
  # 指令→角速度応答の遅延は実測 5〜10ms(VQ1真値、軸別[5,5,10]) = 120Hz物理で約1ステップ
  act_delay_steps:   1
  act_delay_jitter:  1

# --- スポーン/衝突(学習環境)。config.py EnvConfig ---
env_physics:
  collision_grace_s:  1.5           # 発進ピン解除の反力残りを除外(実機deploy 1.5sと整合)
  spawn_below_center: 0.3
  spawn_pitch_deg:    -17.8         # 前傾(実測)
  spawn_jitter_deg:   2.0
  # --- 発進拘束(ピン)。VQ1実測 2026-07-28 (scripts/probe_start.py) ---
  # 実シムはスポーン後、位置も姿勢も *完全に固定* される(加速度計は1.00g=重力反力)。
  # 解除の引き金は「thrust > 約0.18 の SET_ATTITUDE_TARGET が届くこと」だけ:
  #   ・何も送らない/thrust≤0.10 → 3秒以上まったく動かない(姿勢指令も効かない)
  #   ・推力ランプ計測で 0.183 で解除(3回一致、遅延補正で 0.180)
  #   ・レースのカウントダウン(開始フラグ)とは無関係。フラグの3秒前でも解除されるし、
  #     フラグ後2秒に送り始めればその時に解除される。ARM も不要
  #   ・解除後は thrust 0.05 でも普通に効く(roll応答 0.477/0.5) = 閾値はスタート専用
  # **発進はルールベース**: 拘束中は方策を使わず pin_start_thrust を出す(実機deployの
  # START_THRUST と同じ構造)。方策に発進の仕方を学ばせる必要がなく、a3=0 が解除閾値
  # (0.18)未満でも必ず発進できる。pin_start_thrust は takeoff_thrust と同値に保つこと。
  pin_start:          true          # falseで従来どおり即飛行開始(拘束なし)
  pin_release_thrust: 0.18
  pin_release_delay_s: 0.07         # 指令到達から解除までの遅れ(late試行から)
  pin_start_thrust:   0.265         # = action.takeoff_thrust = deploy.start_thrust

# --- 本番シム推論(デプロイ)。dcl/client.py ---
deploy:
  use_rad_per_sec_body_rates: true  # bit16(rev3390 rad/s)。VQ1レガシービルドでも有効と実測
  # VQ1真値の実測プラントゲイン。dynamics.cmd_gain と同値にしてあるので送信スケールは1になる
  rate_plant_gain_rads: [0.95, 0.96, 0.86]
  rate_cmd_gain:        [2.44, 2.46, 2.18]  # レガシー(bit16 off)時のプラントゲイン
  measured_hover:       0.2665      # A==g の実測推力(同定プラン ScriptedRatePilot が基準に使う)
  # rel_dist = 1 - bbox面積/これ。学習側 SimGateDetector は s_px=FX·2.7/d の幾何投影を
  # 契約値150000で割る。YOLOX-xの実bbox面積を既知距離のレンダで実測したところ幾何投影の
  # 1.10倍(2/5/8m×9ゲート、2026-07-26)で、旧値25000は6倍過小 → 同じ距離でrel_distが
  # 極端に小さく出ていた(実飛行ログ runs/dcl_fable_0724b: rel_dist平均0.38・p10=0.00 に対し
  # Genesis学習時は平均0.82・p10=0.50)。方策は「もうゲート直前」と誤認し続けていた。
  real_gate_area_max:   150000.0    # = contracts.GATE_AREA_MAX(契約どおり)
  start_thrust:         0.265       # ピン解除前に出す推力(= takeoff_thrust)
  # 生HIGHRES_IMU gyro は「内部標準FRD角速度の符号反転」そのもの(VQ1真値で確定)。
  # 学習側 signs.gyro=[-1,-1,-1] が同じ変換をするので、デプロイは生値をそのまま渡せばよい。
  # (旧: 学習[1,1,-1]×デプロイ[-1,-1,-1] で yaw の観測符号が学習と実機で反転していた)
  gyro_obs_sign:        [1.0, 1.0, 1.0]
  accel_obs_sign:       [1.0, 1.0, 1.0]
  collision_accel_mps2: 40.0        # |accel|>これ で衝突検知(発進1.5sグレース後)
